<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff7fa5" />
  <title>给孟雨婷的小惊喜</title>
  <style>
    :root {
      --pink: #ff6f9f;
      --deep-pink: #ef477a;
      --light-pink: #ffd9e6;
      --cream: #fff8f3;
      --text: #6b4050;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(255,210,225,.8), transparent 35%),
        linear-gradient(160deg, #fff2f7 0%, #ffdbe8 45%, #ffc4d7 100%);
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.55) 1px, transparent 1px);
      background-size: 34px 34px, 52px 52px;
      background-position: 0 0, 15px 18px;
      pointer-events: none;
      opacity: .7;
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: .35; }
      to { opacity: .85; }
    }

    .page {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }

    .intro {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.58), rgba(255,211,226,.93));
      transition: opacity .7s ease, transform .7s ease;
    }

    .intro.hide {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    .gift-wrap {
      text-align: center;
      user-select: none;
      cursor: pointer;
      animation: float 2.2s ease-in-out infinite;
    }

    .gift {
      position: relative;
      width: 150px;
      height: 120px;
      margin: 0 auto 28px;
      border-radius: 14px;
      background: linear-gradient(145deg, #ff7aa7, #f64e87);
      box-shadow: 0 20px 45px rgba(222, 74, 126, .28);
    }

    .gift::before {
      content: "";
      position: absolute;
      left: 60px;
      top: 0;
      width: 30px;
      height: 100%;
      background: rgba(255, 238, 178, .95);
    }

    .gift-lid {
      position: absolute;
      left: -8px;
      top: -18px;
      width: 166px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(145deg, #ff8ab2, #f65c91);
      box-shadow: 0 8px 14px rgba(207, 48, 105, .18);
      transition: transform .5s ease;
    }

    .gift-lid::before {
      content: "";
      position: absolute;
      left: 67px;
      top: 0;
      width: 30px;
      height: 100%;
      background: rgba(255, 238, 178, .95);
    }

    .bow {
      position: absolute;
      top: -52px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 45px;
    }

    .bow::before,
    .bow::after {
      content: "";
      position: absolute;
      width: 45px;
      height: 34px;
      border: 10px solid #ffeaa5;
      border-radius: 50% 50% 45% 55%;
      top: 7px;
    }

    .bow::before {
      right: 36px;
      transform: rotate(22deg);
    }

    .bow::after {
      left: 36px;
      transform: rotate(-22deg);
    }

    .tap-text {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #d84274;
      text-shadow: 0 2px 8px rgba(255,255,255,.7);
    }

    .tap-sub {
      margin-top: 8px;
      font-size: 14px;
      opacity: .72;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .card {
      position: relative;
      z-index: 5;
      width: min(92vw, 420px);
      min-height: 530px;
      padding: 34px 24px 28px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 30px;
      background: rgba(255,255,255,.74);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        0 24px 60px rgba(219, 82, 130, .22),
        inset 0 1px 0 rgba(255,255,255,.9);
      text-align: center;
      opacity: 0;
      transform: translateY(24px) scale(.96);
      transition: opacity .9s ease .25s, transform .9s cubic-bezier(.2,.8,.2,1) .25s;
    }

    .card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .avatar {
      width: 92px;
      height: 92px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 46px;
      background: linear-gradient(145deg, #fff7fa, #ffd5e3);
      box-shadow: 0 10px 28px rgba(232, 87, 137, .2);
      animation: heartbeat 1.8s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.08); }
      30% { transform: scale(1); }
      45% { transform: scale(1.05); }
      60% { transform: scale(1); }
    }

    h1 {
      margin: 6px 0 10px;
      color: #d83f72;
      font-size: clamp(25px, 7vw, 34px);
      line-height: 1.25;
    }

    .subtitle {
      margin-bottom: 22px;
      font-size: 14px;
      color: #9e6a7c;
      letter-spacing: 1px;
    }

    .message {
      min-height: 190px;
      padding: 20px 18px;
      border-radius: 22px;
      text-align: left;
      line-height: 1.9;
      font-size: 16px;
      background: linear-gradient(145deg, rgba(255,246,249,.95), rgba(255,232,240,.82));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      margin-left: 2px;
      vertical-align: -2px;
      background: #df4d7f;
      animation: blink .8s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .btn {
      margin-top: 22px;
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, #ff72a1, #ef477a);
      box-shadow: 0 12px 25px rgba(221, 67, 120, .28);
      cursor: pointer;
      transition: transform .15s ease;
    }

    .btn:active {
      transform: scale(.97);
    }

    .hint {
      margin-top: 12px;
      font-size: 12px;
      opacity: .55;
    }

    .heart {
      position: fixed;
      z-index: 12;
      pointer-events: none;
      user-select: none;
      will-change: transform, opacity;
      animation: rise var(--dur) ease-out forwards;
      filter: drop-shadow(0 4px 6px rgba(218, 62, 116, .2));
    }

    @keyframes rise {
      0% {
        opacity: 0;
        transform: translate3d(0, 12px, 0) scale(.5) rotate(0deg);
      }
      15% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate3d(var(--x), -110vh, 0) scale(1.35) rotate(var(--r));
      }
    }

    .spark {
      position: fixed;
      z-index: 15;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      background: var(--c);
      box-shadow: 0 0 12px var(--c);
      animation: burst .85s ease-out forwards;
    }

    @keyframes burst {
      from {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      to {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(.1);
      }
    }

    .footer-love {
      margin-top: 16px;
      font-size: 13px;
      color: #c85b7f;
      opacity: .9;
    }

    @media (max-height: 680px) {
      .card {
        min-height: auto;
        padding-top: 24px;
      }
      .avatar {
        width: 72px;
        height: 72px;
        font-size: 36px;
      }
      .message {
        min-height: 150px;
        line-height: 1.7;
      }
    }
  </style>
</head>
<body>
  <main class="page" id="page">
    <section class="intro" id="intro" aria-label="打开惊喜">
      <div class="gift-wrap" id="openGift">
        <div class="gift">
          <div class="gift-lid"></div>
          <div class="bow"></div>
        </div>
        <div class="tap-text">孟雨婷，点开有惊喜 ♡</div>
        <div class="tap-sub">轻轻点一下礼物</div>
      </div>
    </section>

    <section class="card" id="card">
      <div class="avatar">💗</div>
      <h1>今天也要开心呀</h1>
      <div class="subtitle">这是一个只属于孟雨婷的小小开心补给站</div>

      <div class="message">
        <span id="typed"></span><span class="cursor" id="cursor"></span>
      </div>

      <button class="btn" id="moreLove">再收一份开心 ✨</button>
      <div class="hint">点屏幕任意位置，也会掉落小爱心</div>
      <div class="footer-love">—— 一个很在乎你的人</div>
    </section>
  </main>

  <script>
    const intro = document.getElementById('intro');
    const card = document.getElementById('card');
    const openGift = document.getElementById('openGift');
    const typed = document.getElementById('typed');
    const cursor = document.getElementById('cursor');
    const moreLove = document.getElementById('moreLove');

    const message =
`孟雨婷：

不管你今天遇到了什么，
都不许偷偷把不开心藏太久。

你不用时时刻刻都坚强，
也不用每一天都表现得很好。
累了就休息，委屈了就告诉我。

我做不了全世界最厉害的人，
但我会认真做那个
愿意哄你、陪你、偏爱你的人。

所以现在，请你笑一下。
因为你笑起来，真的很好看。`;

    let opened = false;

    function typeText(text, speed = 58) {
      let i = 0;
      typed.textContent = '';
      const timer = setInterval(() => {
        typed.textContent += text[i] || '';
        i++;
        if (i >= text.length) {
          clearInterval(timer);
          setTimeout(() => cursor.style.display = 'none', 700);
        }
      }, speed);
    }

    function createHeart(x = Math.random() * innerWidth, y = innerHeight + 20, size = 18) {
      const hearts = ['💗', '💖', '💕', '💓', '💞', '🌸'];
      const el = document.createElement('div');
      el.className = 'heart';
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.fontSize = `${size + Math.random() * 18}px`;
      el.style.setProperty('--x', `${(Math.random() - .5) * 180}px`);
      el.style.setProperty('--r', `${(Math.random() - .5) * 90}deg`);
      el.style.setProperty('--dur', `${3.2 + Math.random() * 2.6}s`);
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }

    function heartRain(count = 28) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          createHeart(Math.random() * innerWidth, innerHeight + 30, 15);
        }, i * 75);
      }
    }

    function burst(x, y, count = 18) {
      const colors = ['#ff5e93', '#ffb4ca', '#ffd166', '#ffffff', '#f48fb1'];
      for (let i = 0; i < count; i++) {
        const p = document.createElement('span');
        p.className = 'spark';
        const angle = (Math.PI * 2 * i) / count + Math.random() * .4;
        const distance = 50 + Math.random() * 90;
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;
        p.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
        p.style.setProperty('--c', colors[Math.floor(Math.random() * colors.length)]);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
      }
    }

    function softChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, ctx.currentTime + i * .12);
          gain.gain.linearRampToValueAtTime(.08, ctx.currentTime + i * .12 + .02);
          gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + i * .12 + .55);
          osc.connect(gain).connect(ctx.destination);
          osc.start(ctx.currentTime + i * .12);
          osc.stop(ctx.currentTime + i * .12 + .6);
        });
      } catch (e) {}
    }

    function openSurprise(e) {
      if (opened) return;
      opened = true;

      const rect = openGift.getBoundingClientRect();
      burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 30);
      softChime();

      setTimeout(() => {
        intro.classList.add('hide');
        card.classList.add('show');
        heartRain(34);
        setTimeout(() => typeText(message), 500);
      }, 380);
    }

    openGift.addEventListener('click', openSurprise);
    openGift.addEventListener('touchend', (e) => {
      e.preventDefault();
      openSurprise(e);
    }, {passive: false});

    moreLove.addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 26);
      heartRain(24);
      moreLove.textContent = '开心已到账，请签收 💗';
      setTimeout(() => moreLove.textContent = '再收一份开心 ✨', 2200);
    });

    document.addEventListener('pointerdown', (e) => {
      if (!opened) return;
      burst(e.clientX, e.clientY, 10);
      for (let i = 0; i < 4; i++) {
        createHeart(
          e.clientX + (Math.random() - .5) * 50,
          e.clientY + 20,
          12
        );
      }
    });

    setInterval(() => {
      if (opened) createHeart();
    }, 800);
  </script>
</body>
</html>
